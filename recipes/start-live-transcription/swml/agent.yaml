# Start live transcription - partial and final transcripts of both legs POSTed
# to your webhook while the call is up, and an AI summary when it ends.
# live_transcribe starts before connect so the bridged conversation is covered.
version: "1.0.0"
sections:
  main:
    - answer: {}
    - live_transcribe:
        action:
          start:
            webhook: "https://your-host.example.com/transcript"
            lang: en
            live_events: true
            ai_summary: true
            direction:
              - remote-caller
              - local-caller
            speech_engine: deepgram
    - connect: { to: "+15550100001" }
    - hangup: {}
